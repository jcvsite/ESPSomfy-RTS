name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

jobs:
  # =======================================================================
  # JOB 1 : Génération du LittleFS unique (Compiles pour Dev ET Release)
  # =======================================================================
  littlefs:
    permissions: write-all
    name: LittleFS Image
    runs-on: ubuntu-latest

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build LittleFS image (générique via esp32dev)
        run: pio run -e esp32dev -t buildfs

      - name: Rename LittleFS to Standard Name
        run: cp .pio/build/esp32dev/littlefs.bin SomfyController.littlefs.bin

      - name: Versioned LittleFS name
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cp SomfyController.littlefs.bin "SomfyController.littlefs-${TAG}.bin"

      # Sauvegarde temporaire du LittleFS pour le job suivant (firmwares)
      - name: Upload LittleFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleFS
          path: SomfyController.littlefs.bin
          retention-days: 5

      # Versioned LittleFS only (this fork is not compatible with unversioned/market assets)
      - name: Upload LittleFS to Release (versioned)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: SomfyController.littlefs-${{ github.event.release.tag_name }}.bin
          asset_path: SomfyController.littlefs-${{ github.event.release.tag_name }}.bin
          overwrite: true

  # =======================================================================
  # JOB 2 : Compilation de chaque carte, Onboard fusionné et Uploads
  # =======================================================================
  arduino:
    permissions: write-all
    name: ${{ matrix.name }}
    needs: [littlefs]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_fs: "0x390000"
            fs_bin: SomfyController.littlefs.bin
            fwname: SomfyController.ino.esp32.bin
            obname: SomfyController.onboard.esp32.bin
            pack: SomfyController.esp32.espsomfy
          - env: esp32wrover
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_fs: "0x390000"
            fs_bin: SomfyController.littlefs.bin
            fwname: SomfyController.ino.esp32wrover.bin
            obname: SomfyController.onboard.esp32wrover.bin
            pack: SomfyController.esp32wrover.espsomfy
          - env: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            addr_fs: "0x390000"
            fs_bin: SomfyController.littlefs.bin
            fwname: SomfyController.ino.esp32c3.bin
            obname: SomfyController.onboard.esp32c3.bin
            pack: SomfyController.esp32c3.espsomfy
          - env: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            addr_fs: "0x390000"
            fs_bin: SomfyController.littlefs.bin
            fwname: SomfyController.ino.esp32s2.bin
            obname: SomfyController.onboard.esp32s2.bin
            pack: SomfyController.esp32s2.espsomfy

          # VERSION ESP32-S3 (4MB - Universelle)
          - env: esp32s3_4mb
            name: ESP32S3_4MB
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_fs: "0x390000"
            fs_bin: SomfyController.littlefs.bin
            fwname: SomfyController.ino.esp32s3_4mb.bin
            obname: SomfyController.onboard.esp32s3_4mb.bin
            pack: SomfyController.esp32s3_4mb.espsomfy

          # VERSION ESP32-S3 (8MB - Spécifique)
          - env: esp32s3_8mb
            name: ESP32S3_8MB
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_fs: "0x610000"
            fs_bin: .pio/build/esp32s3_8mb/SomfyController.littlefs.bin
            fwname: SomfyController.ino.esp32s3_8mb.bin
            obname: SomfyController.onboard.esp32s3_8mb.bin
            pack: SomfyController.esp32s3_8mb.espsomfy

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      # Récupération du LittleFS généré au Job 1
      - name: Get LittleFS
        uses: actions/download-artifact@v4
        with:
          name: LittleFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # pio run wipes a pre-staged LittleFS; restore after firmware and pack .espsomfy
      - name: Pack .espsomfy (restore shared LittleFS)
        if: matrix.env != 'esp32s3_8mb'
        env:
          BUILD: .pio/build/${{ matrix.env }}
          FWNAME: ${{ matrix.fwname }}
          PACK: ${{ matrix.pack }}
        run: |
          set -e
          mkdir -p "$BUILD"
          cp SomfyController.littlefs.bin "$BUILD/SomfyController.littlefs.bin"
          if [ ! -f "$BUILD/$FWNAME" ]; then
            cp "$BUILD/firmware.bin" "$BUILD/$FWNAME"
          fi
          python3 <<'PY'
          import os, struct
          build = os.environ["BUILD"]
          fw_path = os.path.join(build, os.environ["FWNAME"])
          fs_path = os.path.join(build, "SomfyController.littlefs.bin")
          out_path = os.path.join(build, os.environ["PACK"])
          chip = {
              "SomfyController.esp32.espsomfy": 0,
              "SomfyController.esp32wrover.espsomfy": 1,
              "SomfyController.esp32c3.espsomfy": 2,
              "SomfyController.esp32s2.espsomfy": 3,
              "SomfyController.esp32s3_4mb.espsomfy": 4,
              "SomfyController.esp32s3_8mb.espsomfy": 5,
          }[os.environ["PACK"]]
          with open(fw_path, "rb") as f: fw = f.read()
          with open(fs_path, "rb") as f: fs = f.read()
          header = bytearray(32)
          header[0:8] = b"ESPSOMFY"
          struct.pack_into("<HBBII", header, 8, 1, chip, 0x03, len(fw), len(fs))
          ver = "v3.4.5"
          for rel in ("data/appversion", "data-dev/appversion"):
              if os.path.isfile(rel):
                  raw = open(rel, encoding="utf-8").read().strip().splitlines()[0].strip()
                  if raw:
                      ver = raw if raw.lower().startswith("v") else f"v{raw}"
                      break
          vb = ver.encode("ascii", "ignore")[:12]
          header[20:20+len(vb)] = vb
          with open(out_path, "wb") as f:
              f.write(header); f.write(fw); f.write(fs)
          print(f"packed {out_path} ({os.path.getsize(out_path)} bytes) ver={ver}")
          PY

      - name: Build LittleFS (8MB partition)
        if: matrix.env == 'esp32s3_8mb'
        run: pio run -e ${{ matrix.env }} -t buildfs

      # Création de l'image de fusion onboard
      - name: ${{ matrix.name }} Image
        run: |
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o .pio/build/${{ matrix.env }}/SomfyController.onboard.bin \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            ${{ matrix.addr_fs }} ${{ matrix.fs_bin }}

      # Compression de l'image onboard avec son nom d'archive propre
      - name: Compress onboard image
        run: zip -j .pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip .pio/build/${{ matrix.env }}/SomfyController.onboard.bin

      # CAS 1 : Si c'est un PUSH de dev
      - name: Upload ${{ matrix.name }} (Dev Artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/SomfyController.onboard.bin
          retention-days: 5

      # CAS 2 : RELEASE uploads — versioned names only
      - name: Stage versioned release assets
        if: github.event_name == 'release'
        id: ver_assets
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUILD: .pio/build/${{ matrix.env }}
          BASE_FW: ${{ matrix.fwname }}
          BASE_PACK: ${{ matrix.pack }}
          BASE_OB: ${{ matrix.obname }}.zip
        run: |
          set -e
          cp "$BUILD/firmware.bin" "$BUILD/$BASE_FW"
          python3 <<'PY'
          import os, shutil
          tag = os.environ["TAG"]
          build = os.environ["BUILD"]
          def versioned(name: str) -> str:
              if name.endswith(".bin.zip"):
                  return name[:-8] + f"-{tag}.bin.zip"
              stem, ext = os.path.splitext(name)
              return f"{stem}-{tag}{ext}"
          mapping = {}
          for key, base in [("fw", os.environ["BASE_FW"]), ("pack", os.environ["BASE_PACK"]), ("ob", os.environ["BASE_OB"])]:
              src = os.path.join(build, base)
              if not os.path.isfile(src):
                  raise SystemExit(f"missing asset: {src}")
              dst_name = versioned(base)
              dst = os.path.join(build, dst_name)
              shutil.copy2(src, dst)
              mapping[key] = dst_name
              print(f"versioned: {dst_name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, name in mapping.items():
                  out.write(f"{key}={name}\n")
          PY

      - name: Upload firmware to Release (versioned)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ steps.ver_assets.outputs.fw }}
          asset_path: .pio/build/${{ matrix.env }}/${{ steps.ver_assets.outputs.fw }}
          overwrite: true

      - name: Upload .espsomfy pack to Release (versioned)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ steps.ver_assets.outputs.pack }}
          asset_path: .pio/build/${{ matrix.env }}/${{ steps.ver_assets.outputs.pack }}
          overwrite: true

      - name: Upload onboard image to Release (versioned)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ steps.ver_assets.outputs.ob }}
          asset_path: .pio/build/${{ matrix.env }}/${{ steps.ver_assets.outputs.ob }}
          overwrite: true
          asset_content_type: application/zip
