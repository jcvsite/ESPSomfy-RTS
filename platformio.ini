[platformio]
default_envs = esp32dev


[common]
lib_deps_base =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8.0
    esp32async/ESPAsyncWebServer @ 3.11.2
    esp32async/AsyncTCP @ 3.4.10
    links2004/WebSockets @ 2.4.1

[env]
platform = espressif32@6.8.1
framework = arduino
lib_deps =
    ${common.lib_deps_base}
    lsatan/SmartRC-CC1101-Driver-Lib @ 3.0.2

extra_scripts = 
    pre:minify_data.py
    post:copy_release_bins.py
board_build.filesystem = littlefs
board_build.partitions = partitions/esp32_4mb_ota.csv
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D NDEBUG
    -Os


[env:esp32dev]
board = esp32dev

; Fallback: SmartRC CC1101 2.5.7. Same chip pack name (esp32).
; Flash .pio/build/esp32dev-cc1101v257/SomfyController.esp32.espsomfy
[env:esp32dev-cc1101v257]
extends = env:esp32dev
lib_deps =
    ${common.lib_deps_base}
    lsatan/SmartRC-CC1101-Driver-Lib @ 2.5.7
build_flags =
    ${env.build_flags}
    -D LIB_CC1101_VER=\"2.5.7\"


[env:esp32wrover]
board = esp-wrover-kit
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3_base]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_4mb]
extends = env:esp32s3_base
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi

[env:esp32s3_8mb]
extends = env:esp32s3_base
board_build.flash_size = 8MB
board_build.partitions = partitions/esp32_8mb_ota.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
